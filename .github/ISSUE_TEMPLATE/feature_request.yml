name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Sift makes hard? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Including other tools. Useful for judging whether this is worth building.
